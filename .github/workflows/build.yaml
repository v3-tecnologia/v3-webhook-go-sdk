name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Configure Git for private modules
      run: |
        git config --global url."https://x-access-token:${{ secrets.GO_PRIVATE_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Set GOPRIVATE
      run: go env -w GOPRIVATE=github.com/v3-tecnologia/*

    - name: Build
      run: go build -v ./...

    - name: Test with race and coverage
      run: |
        go test ./pkg/processing ./pkg/security ./pkg/handlers ./pkg/persistence \
          -race -coverprofile=coverage.out -covermode=atomic
        total=$(go tool cover -func=coverage.out | awk '/total:/ {print $3}' | tr -d '%')
        echo "Core SDK coverage: ${total}%"
        awk -v c="$total" 'BEGIN { if (c+0 < 80) { print "coverage below 80%"; exit 1 } }'
